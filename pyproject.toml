[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.1.0"
description = "Auditing demand-forecast explanations under stockout censoring (Phase 1 study and prototype)"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
